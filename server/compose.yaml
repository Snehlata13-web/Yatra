services:
  yatra-api:
    build:
      context: .
    container_name: yatra-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_DIR: /app/logs
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - yatra-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  yatra-logs:
